[project]
name = "samjho"
version = "0.1.0"
description = "Study companion for CBSE Class 10 — retrieval over the student's own copy of their textbook, with citations, refusals, and interactive concept animations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff==0.6.9",
    "mypy>=1.10",
    "types-requests",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingest", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast, deterministic, no database and no model download",
    "integration: needs Postgres + pgvector (and downloads the local embedding model)",
    "eval: runs the golden-set retrieval evaluation and enforces its thresholds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
