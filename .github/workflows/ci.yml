# samjho — continuous integration.
#
# Gates, none of them soft: lint (ruff), typecheck (mypy), unit tests (pytest -m unit), integration
# tests (pytest -m integration, against a real Postgres + pgvector), web typecheck and build, a docker
# compose parse check, and the licensing guard.
#
# There is no `continue-on-error`, no `|| true` on a test step, and no deselection anywhere in this
# file, and none may be added: docs/PLAN.md §6 and docs/CONTRACTS.md §0 both require that CI be able
# to fail.
#
# State as of 2026-09-20: `ruff check .` currently reports 11 errors in sibling-owned code, so the lint
# job is red — fix the findings, do not weaken the job. The eval gate lives in eval.yml and cannot run
# on a GitHub-hosted runner at all; see the note at the top of that file.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------------------------
  # THE LICENSING GUARD. This is the job that protects the project from its single biggest risk:
  # textbook material reaching the git history. It exists because `.gitignore` is advice and
  # `git add -f` ignores advice. Rationale and consequences: docs/adr/ADR-001-licensing-boundary.md
  # ---------------------------------------------------------------------------------------------
  licensing-guard:
    name: licensing guard — no textbook or corpus material in git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a textbook PDF, a corpus path or extracted book text is tracked
        shell: bash
        run: |
          set -uo pipefail

          # `git ls-files` lists what git actually tracks, so this catches the cases .gitignore
          # cannot: `git add -f`, a merge that resurrects a deleted file, or an edit that widens a
          # .gitignore pattern.
          #
          # Two narrow, reviewable exemptions, both required by docs/CONTRACTS.md §0:
          #   data/demo-corpus/**  — openly licensed third-party text, source URL + licence +
          #                          retrieval date recorded per file in SOURCES.md
          #   tests/fixtures/**    — synthetic fixtures the authors wrote or generated themselves
          # A PDF or a text file anywhere else fails the build.
          tracked=$(git ls-files)

          pdfs=$(printf '%s\n' "$tracked" | grep -Ei '\.pdf$' | grep -Ev '^(data/demo-corpus|tests/fixtures)/' || true)
          corpus=$(printf '%s\n' "$tracked" | grep -E '(^|/)corpus/' || true)
          texts=$(printf '%s\n' "$tracked" | grep -Ei '\.txt$' | grep -Ev '^(data/demo-corpus|tests/fixtures)/' || true)

          status=0
          report() {
            label="$1"; hits="$2"
            if [ -n "$hits" ]; then
              echo "::error::$label"
              printf '%s\n' "$hits" | sed 's/^/    tracked: /'
              status=1
            fi
          }

          report "Textbook PDFs must never be committed — only data/demo-corpus/** and tests/fixtures/** are exempt" "$pdfs"
          report "Nothing under corpus/ may be committed: it is the student's own copy of the book" "$corpus"
          report "Extracted textbook text must never be committed (*.txt outside the two exempt directories)" "$texts"

          if [ "$status" -ne 0 ]; then
            echo
            echo "This is the licensing guard from docs/adr/ADR-001-licensing-boundary.md."
            echo "NCERT's terms of use prohibit republication of their textbooks and prohibit using"
            echo "them as part of a digital content package or software, so book text cannot be in"
            echo "this repository in any form — not as a PDF, not as extracted text, not as a chunk"
            echo "store or an embedding index. Untrack the file, keeping your local copy:"
            echo
            echo "    git rm --cached <path>"
            echo
            echo "If this is a false positive — a synthetic fixture you authored, or permissively"
            echo "licensed material — put it under tests/fixtures/ or data/demo-corpus/ and record its"
            echo "source URL, licence and retrieval date in data/demo-corpus/SOURCES.md, or open a PR"
            echo "explaining the licence. Do not silence this job."
          fi

          exit "$status"

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check .
      # `ruff format --check .` is deliberately not enabled yet: the tree is not formatted, and a
      # formatting gate that arrives together with a reformat of someone else's in-flight file is a
      # merge conflict, not a quality gate. Enable it once the builders have landed.

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: mypy
        # `mypy .` covers the packages declared in pyproject.toml (`ingest`, `api`) plus `evals` and
        # `tests`. Config (python_version, warn_unused_ignores, ignore_missing_imports) comes from the
        # [tool.mypy] table there.
        run: uv run mypy .

  unit-tests:
    name: unit tests (pytest -m unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: pytest -m unit
        # `unit` means fast, deterministic, no database and no model download (pyproject.toml), which
        # is why this job needs no services.
        run: uv run pytest -m unit

  integration-tests:
    name: integration tests (pytest -m integration, Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: samjho
          POSTGRES_PASSWORD: samjho
          POSTGRES_DB: samjho
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samjho -d samjho"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://samjho:samjho@localhost:5432/samjho
      # First run downloads the local embedding and reranker models (~200 MB); cached afterwards.
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: pytest -m integration
        # tests/conftest.py states that CI runs these against a real database and that a missing
        # database must fail loudly rather than skip — so no `--ignore` and no skip flags here. The
        # fixtures load synthetic chunks under a `fixture-` subject prefix, never textbook text.
        run: uv run pytest -m integration

  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Deliberately no `cache: .next` / no caching of the build output between runs: a stale .next
      # directory produced a false "Failed to collect page data for /[subject]" failure locally, on a
      # tree that builds cleanly from scratch. Cache the npm store, never the build output.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            # A committed lockfile is expected now; without one `npm ci` cannot run, and the loud
            # failure is the point. This branch exists only so the message says why.
            echo "::error::web/package-lock.json is missing — commit it (npm install --package-lock-only)"
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          # NEXT_PUBLIC_* is inlined at build time; the app must build with no API reachable.
          NEXT_PUBLIC_API_URL: http://localhost:8000

  infra:
    name: infra — docker compose parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        # Validates infra/docker-compose.yml (service graph, healthchecks, env interpolation) without
        # starting anything. Every variable has a ${VAR:-default} fallback, so this must pass with no
        # .env file present.
        run: docker compose -f infra/docker-compose.yml config --quiet
